name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build dist
        run: bash scripts/build_dist.sh

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arknights-skill-${{ steps.version.outputs.version }}.zip
            dist/arknights-skill-${{ steps.version.outputs.version }}.sha256
          generate_release_notes: true
