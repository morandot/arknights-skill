[project]
name = "arknights-skill"
version = "1.6.1"
description = "Agent Skill for Arknights guidance and local Doctor profile memory."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
